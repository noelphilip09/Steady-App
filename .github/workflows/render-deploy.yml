# Deploys every push to main to the Render web service through the Render API.
# The service was created from the public repository URL, so Render has no GitHub webhook
# for it; this workflow is what makes a push go live. It needs one repository secret:
#   RENDER_API_KEY  — a Render API key (Render dashboard → Account Settings → API Keys)
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_SERVICE_ID: srv-dbfmmarrjlhs73en6sug
      SITE_URL: https://steady-app-pm0y.onrender.com
    steps:
      - name: Trigger a deploy of this commit
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::The RENDER_API_KEY repository secret is not set."; exit 1
          fi
          resp=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${GITHUB_SHA}\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          id=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then echo "::error::Render did not start a deploy: $resp"; exit 1; fi
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "Deploy $id started for commit ${GITHUB_SHA::7}"

      - name: Wait for the deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            status=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" | jq -r '.status // "unknown"')
            echo "$(date -u +%H:%M:%S) ${status}"
            case "$status" in
              live)
                echo "Live at ${SITE_URL}"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ${DEPLOY_ID} ended as ${status}. Log: https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for deploy ${DEPLOY_ID} (still ${status})."; exit 1

      - name: Smoke-check the live site
        run: |
          set -euo pipefail
          curl -sS --fail --retry 6 --retry-delay 10 --retry-all-errors "${SITE_URL}/api/health"; echo
          curl -sS --fail -o /dev/null -w 'couchsurfer login: HTTP %{http_code}\n' "${SITE_URL}/couchsurfer/login"
