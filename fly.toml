# fly launch --copy-config --no-deploy && fly volumes create steady_data --size 1 && fly deploy
app = "steady-app"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  STEADY_DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[mounts]
  source = "steady_data"
  destination = "/data"
